source: 聚宽2025年精选/58Debug-输出信息-多标的版ETF策略(ETF复现之三）.txt
source_sha256: e7ff4f030f9549890c3277b2ca7eefbb068893832a12c7d0b685206b2e4f7401
formal_acceptance: false
original_strategy_complete: false
economic_variant_approved: false
review_scope: 全文159行、6顶层定义；18字面条目/17基金、排序/重复键/预筛与持仓反馈、指标候选参考及日志检查，不含完整排名或基金交易
rules:
  - 原顺序516510/159985/515880/513060/512660/513520/513330/515790/512100/512100/159998/513500/162719/159949/515030/159928/513100/159995；不按注释替换第二个512100
  - 基准513100，avoid_future_data与use_real_price真；原文无显式set_order_cost，不推断默认基金费用
  - longdays20、shortdays5，每基金attribute_history20行，末价除首价减1，实际只有19段收益；均线分别全部20行和末5行
  - 按inc降序，MA5严格高于MA20且inc严格大于0.05、小于0.2才列入前2买表；前4排名保留原重复条目
  - 持仓不在前4或其inc任一严格高于0.2，且不在买表才卖；持仓在买表且不卖时仅移除第一次匹配项
  - 09:25调用check_etf，09:30展示、trade又调用check_etf；change_day1、day0，每次成功trade最后day加1
  - 先发所有清仓目标，随后取实际positions键数；少于2才按available_cash除剩余槽位取一次cash，并依次发买表目标值
  - 发单后positions键数恰等于2才break；重复前2可以向同一证券发两次目标值，不能据此推断双倍实际持仓
  - 15:10打印持仓/累计与日收益，更新previous_portfolio_value和显示名/日期键日志；日志不是唯一Book账本
allowed_evidence: 四原生候选11095个20行指标窗口及明确位置访问协议stub；缺日和分年统计保留，原完整17基金排名、历史执行/费用/平台等价与交易均未放行
data_gaps:
  - 所选SHA注册仅159949/512100/513100/513500候选；缺其余13基金，不是全机缺失证明，不能缩池替代原组合
  - 基金历史身份、复权/权益事件、状态、费用、订单目标金额与09:30持仓/现金反馈语义仍未证明
  - 512100缺2022-09-02、513100缺2022-01-13、513500缺2022-03-29，共57原生窗口跨缺日；停牌或丢行原因未证
defects:
  - 当前pandas日期索引close[-1]报KeyError；位置协议只作参考，不是已批准兼容修正版
  - 重复512100进入排序和买表，已持仓项仅删除一次；即时或延迟清仓反馈影响剩余容量
  - 两个买单可能使用同一cash目标，排序平局保持当前原sort_values行为；不补自定义稳定排序或费用
next: 补齐原17基金历史身份/行情/事件/复权/状态和开盘执行及默认费用证据；具体兼容或经济修正版需确认，足够输入后唯一Book最长三成本、逐年与禁网复现
