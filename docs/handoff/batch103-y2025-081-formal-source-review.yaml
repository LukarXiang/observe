formal_acceptance: false
original_strategy_complete: false
economic_variant_approved: false
review_scope: 全文139行、5顶层定义；原无序set、三价评分/基准价、随机平局、严格阈值和订单状态；原函数诊断、单基金价格与无序随机平局的来源研究验收范围，不含原交易
rules:
- 原11项set为510500/510300/510050/159949/513100/513500/159920/513520/513030/162411/159985；无序遍历，未设random种子
- 基准000300、avoid_future_data和use_real_price真；before_open和after_close回调、my_trade固定14:50
- 原每证券请求30个不含当天日收盘；旧三价取负23至负20的切片，其均值作his_n_price；不验证完整30行
- 当前价或旧均价NaN、或任一小于0.01则整个回调立即返回；20行导致旧切片为空而返回，但21行可能用只有一项的旧切片继续算，不自动修复短窗
- R为末两条日收盘加14:50现价，减旧三价之和，再除旧三价和乘100；base_price为负21位置，与旧三价最后一项同位
- 原R重复时加random.random除1000，再记入R_LIST；只扰动一次，没有循环确保扰动后唯一，零随机值仍可能留平局
- SEC_LIST元组反向排序，R平局继续比较证券代码等字段；不增设仅按评分的稳定排序
- 空仓时第一名现价严格高于base乘1.001才按portfolio.cash发目标值；随后更新STATUS和ETF_HOLD，不检查订单返回值或成交
- 持仓仍第一名时，现价严格低于base乘0.999才清仓并置STATUS0、ETF_HOLD空格，否则维持
- 第一名换证券，仅当新第一名现价严格高于base乘1.001才卖旧买新；买新取卖单之后当时实际portfolio.cash，随后更新ETF_HOLD
- 基金买卖佣金0.0001、最低5、close_tax0，PriceRelatedSlippage0.001；HOLD_NUM初始0且未实际维护
data_gaps:
- 所选五份原始登记仅5/11基金候选；缺159920/159985/162411/510300/513030/513520，不能缩池排名或交易
- 当前快照目标基金标准日线、5m、复权覆盖和权益事件均0；原14:50现价、基金状态和历史身份/费用/卖后现金反馈未齐
- 不把未复权日终close当作历史14:50当前价格；原生缺日和尺度变化保持，原因仍需公告/事件核对
defects:
- 当前pandas日期索引和RangeIndex对close_data1负整数访问均报KeyError；位置数组只作显式算式与回调诊断，未批准兼容修正版
- 无序set和未设种子的平局扰动可影响赢家；跨进程hash环境和受控随机流仅证明诊断范围，不是已批准的稳定交易版本
- 状态在发单后即更新，尚无成交确认；延迟卖后现金会导致新买金额低于即时反馈，不能直接按总权益替代
next: 补齐原池/盘中与基金执行，保留真实随机和平局状态证据；具备交易前提时具体询问兼容/随机语义方案，再复用唯一Book最长三成本、逐年和禁网复现
allowed_evidence: 45受控原函数诊断、28078/17157个旧原生日终价格窗口、显式类型/反馈/随机对照及两轮禁网逐字节核验；日终代理不是盘中现价，单基金算式不是完整池排名；原交易0
