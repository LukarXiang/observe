formal_acceptance: false
original_strategy_complete: false
economic_variant_approved: false
review_scope: 全文243行、10顶层定义；原11基金映射、动态热度、信号和订单状态；原函数诊断、单基金价格及热度算式参考的来源研究验收范围，不含原交易
rules:
- 原基金值顺序159901/162605/161005/510050/510180/510880/159905/159915/510300/510500/159949；162605和161005仍保留，不按ETF标签删除主动基金
- 基准000300，avoid_future_data和use_real_price真；signal初始化KEEP，因此交易回调注册为14:40，11:30得到卖出信号不会重注册13:00
- 每基金attribute_history取13个日收盘，df=False；11:30现价相对第一条收盘的收益乘100，相对13行均值的偏离乘100；不是以映射指数算收益
- 原sort_values按收益降序，不注入自定义稳定排序；缺值填负100，动态热度参考取排名最后基金的逆映射，主动基金可能被选为自身的成交量参考
- EmotionMonitor请求100行参考证券volume，用TA-Lib MA7；最近负偏离连续至少5行才返回负1，最近正偏离需3行才返回1，否则返回0
- 30行查找没有找到符号转换可返回None；任何异常返回1，不能把None改为0或将异常静默变成无信号
- 热度负1清g.last和g.buy并卖出；最大收益小于0.1或最大项偏离小于0时，g.last为空返回KEEP，否则清状态卖出；代码不是注释的1个百分点
- 删除收益小于0.1或偏离小于0的行；两个shape大于12分支在原11池不可达，正常路径只向g.buy追加第一名
- 卖出遍历positions.keys，保留511880；KEEP不主动换仓；执行完若positions为空，仍按available_cash发511880目标金额
- BUY先清511880，g.last取当时实际持仓键；目标cash为total_value除买表长度，不按现金缩减；先清非目标，再删除g.clear中的旧标的
- 对每个保留目标又遍历全部持仓，value/cash严格大于1.5才发目标金额；多目标可重复向同一持仓发目标单
- 不在g.last才发order_value，随即追加g.last，不检查返回订单或成交；执行后清g.buy，意图持仓不是已成交持仓
- 每日盘前设置FixedSlippage0及PerTrade买卖0.0005、最低5；平台旧费用接口、基金现金和权益执行仍需核对
data_gaps:
- 所选五份原始登记复用7/11基金候选；159901/162605/161005/510300缺候选，不构成全机或供应商缺失证明
- 当前快照目标基金bars_1d、bars_5m、adj_factors、adj_coverage和corp_actions均0；仅000300指数日线5280行，不足动态热度完整参考
- 原11:30当前价格、动态热度100行volume取数和停牌/复权口径、14:40基金执行/身份/事件/状态/现金反馈未齐
- 动态参考池有8/11所选volume输入，默认399001另有候选；缺399632/162605/161005，原全池选择与平台volume dtype、量单位、停牌处理未证明
defects:
- 即时清仓修改活跃positions.keys可能报RuntimeError；原函数保留，不推断平台一定发生或不会发生
- BUY空表除零、陈旧g.clear可ValueError；清货币基金反馈滞后可重复清仓，未成交买单仍更新g.last
- g.last为空时KEEP仍可能买货币基金；原11池选前三的注释未实现，日终单基金算式不能代替完整池信号
- 原生Sina整数volume直接传TA-Lib MA报input array type is not double，但原函数吞异常返回1；显式float转换只用于算式参考，未经批准用于交易
next: 缺失池/盘中/身份事件费用执行仍逐项搁置；volume dtype与原MA数值语义需平台证据，具体兼容或经济变体确认后才唯一Book最长三成本/逐年/核费/禁网复现
allowed_evidence: 45受控原函数诊断、28078/17157个旧原生日终价格窗口、显式类型/反馈/随机对照及两轮禁网逐字节核验；日终代理不是盘中现价，单基金算式不是完整池排名；原交易0；八个旧原生指数volume及实际5280日沪深300volume投影的最长100行热度参考；原生整数直接触发TA-Lib异常并走返回1，另列显式float参考与独立算式，平台dtype仍未证
