source: 2024年度精选策略1/72.桥水 全天候策略 增加一致性度量ES 风险控制.txt
source_sha256: b30d9ba30a2e18bc162261a783479d853ff6768b4ae85963d39315fc85683835
formal_acceptance: false
original_strategy_complete: false
economic_variant_approved: false
review_scope: 全文256行、10顶层与13含嵌套定义；原月回调/组上市规则、全局倒ES、受控收益注入及最长五基金候选参考；不含原七基金交易
rules:
  - 七基金为510310/513100/513500/511010/511260/518880/510170，组内任一字面上市日期达标便启用整组
  - 月首开盘回调，run_count从0按月回调增加，period12，默认仅每12次月回调重平衡
  - confidencelevel2.58、lag120，原日收益resample自然日、默认pct_change和fillna，历史平台语义未证
  - ES含i<=int(120*a)端点且除int(120*a)，默认取最差两项除1；保留单项数组
  - 全证券1/ES统一归一化，类rate未参与；零/负/非有限ES不自行修正
  - 先退出旧非目标和减仓，再发剩余目标；保存证券键目标值，涨幅统计查资产类键；raise_rate默认负1关闭
  - 股票买卖佣金0.0003/最低5/卖税0.001，基金买卖佣金0.0003/最低5；不能借股票费用实现基金成交
allowed_evidence: 两个显式自然日处理仅作未发布原生行情参考，原get_stock_ES接受注入收益；不是原日收益兼容修正版、原组合权重或平台等价
data_gaps:
  - 所选与扩展staging结果登记未取得511260/510170，不是全机不存在数据的证明
  - 五基金身份/历史复权与停牌/完整公司行动及基金执行费用未放行；原字面上市日不证明候选从该日完整
  - 513100缺2022-01-13、513500缺2022-03-29，各119原生窗口跨缺日；原生价格尺度变化原因未证
defects:
  - 当前pandas原resample的how参数报TypeError；原fillna的method兼容性仍待逐项核实，未修
  - 组内未来上市证券提前入池；未使用类rate、证券/类基线键不一致；这些原规则不自动修正
  - 零ES倒数/权重可能inf或NaN，confidence5使固定分母0；非默认边界不能偷偷加epsilon
next: 补齐原七基金身份、事件/停牌与复权版本、历史日收益处理和执行证据；原72修正需单独具体确认，D-allweather-fill仅7/65；足够输入后唯一Book三成本/逐年/禁网复现
