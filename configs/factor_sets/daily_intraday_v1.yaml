# 日频基础因子 + 分钟聚合因子（阶段 4 成对实验的「加分钟特征」一侧）。前 9 个因子与 daily_basic_v1.yaml 逐字相同、顺序相同（相关性去重时优先保留靠前者），后 7 个是新增的分钟因子。
# direction 是研究开始前按经济含义先验固定的假设，不依据任何回测结果修改；分钟因子只在分钟股票池内的证券有值，用法见 docs/modules/12-因子与表达式.md「分钟聚合特征」。
version: 1
min_obs_ratio: 0.8          # 窗口内有效值少于 80% 时输出缺失（停牌日在日历上占位）
factors:
  - name: rev_5
    expr: close_adj / ts_delay(close_adj, 5) - 1
    direction: -1
    desc: 5 日收益；A 股短期反转，近期涨幅大的随后相对走弱
  - name: rev_20
    expr: close_adj / ts_delay(close_adj, 20) - 1
    direction: -1
    desc: 20 日收益；中期反转
  - name: mom_60_skip5
    expr: ts_delay(close_adj, 5) / ts_delay(close_adj, 60) - 1
    direction: 1
    desc: 剔除最近 5 日的 60 日收益；中期动量
  - name: vol_20
    expr: ts_std(ret, 20)
    direction: -1
    desc: 20 日收益标准差；低波动异象
  - name: range_20
    expr: ts_mean((high_adj - low_adj) / close_adj, 20)
    direction: -1
    desc: 20 日平均振幅；日内波动大的随后相对走弱
  - name: turnover_20
    expr: ts_mean(turnover, 20)
    direction: -1
    desc: 20 日平均换手；过度交易的股票随后相对走弱
  - name: amihud_20
    expr: ts_mean(abs(ret) / amount, 20)
    direction: 1
    desc: 20 日 Amihud 非流动性；流动性差需要收益补偿
  - name: amount_surge
    expr: amount / ts_mean(amount, 20)
    direction: -1
    desc: 当日成交额相对 20 日均值；放量后短期回落
  - name: pv_corr_20
    expr: ts_corr(close_adj, volume, 20)
    direction: -1
    desc: 20 日价量相关；量价同向推动的上涨难以持续
  # ---- 分钟聚合因子：日频字段由 5 分钟线聚合（factors/intraday.py），这里取 20 日均值降低单日噪声 ----
  - name: rv_20
    expr: ts_mean(rv_5m, 20)
    direction: -1
    desc: 20 日日内已实现波动（5 分钟收益平方和的平方根）均值；日内波动大的股票随后相对走弱（低波动异象在日内尺度的版本）
  - name: rskew_20
    expr: ts_mean(rskew_5m, 20)
    direction: -1
    desc: 20 日日内已实现偏度均值；正偏（彩票型）股票被高估，随后相对走弱
  - name: rsj_20
    expr: ts_mean(rsj_5m, 20)
    direction: -1
    desc: 20 日相对符号跳跃（上行半方差减下行半方差，除以总方差）均值；上行波动占优的股票随后相对走弱
  - name: open30_20
    expr: ts_mean(open30_ret, 20)
    direction: -1
    desc: 20 日开盘 30 分钟收益均值；开盘追涨的散户情绪推高价格，随后回落（与短期反转同向）
  - name: tail30_20
    expr: ts_mean(tail30_ret, 20)
    direction: -1
    desc: 20 日尾盘 30 分钟收益均值；尾盘拉升多为短线资金推动，随后回落
  - name: tail_share_20
    expr: ts_mean(tail_amount_share, 20)
    direction: -1
    desc: 20 日尾盘 30 分钟成交额占全天比例均值；尾盘抢筹式的博弈交易随后相对走弱
  - name: vwap_dev_20
    expr: ts_mean(vwap_dev, 20)
    direction: -1
    desc: 20 日收盘价相对全天成交均价偏离均值；收盘价高于均价说明尾段被推高，随后回落
