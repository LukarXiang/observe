# 第一版研究流水线：沪深主板、基础日频因子、h = 5 的复权 open-to-open 标签、滚动切分 + 最终留出、两个基线与 Ridge。
# 快照在命令行指定：observe --root data research --config configs/research/daily_basic_v1.yaml --snapshot <snapshot_id>
factor_set: configs/factor_sets/daily_basic_v1.yaml
label_h: 5
universe:
  boards: [main]
  min_listed_sessions: 120
  exclude_st: true
  suspend_window: 20
  max_suspended: 10
  liquidity_window: 20
  min_avg_amount: 20000000
split:
  train: 504
  valid: 126
  test: 63
  holdout: 252          # 最近 252 个交易日为最终留出：不生成预测、不参与因子挑选、参数与组合规则选择
models:
  baseline_factor: rev_5
  ridge_alphas: [1, 10, 100, 1000, 10000]
  correlation_threshold: 0.9
  min_names: 30
  top_n: 20
